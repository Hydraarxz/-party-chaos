<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Chaos</title>
    
    <!-- CSS-Einbindung mit neuem Cache-Buster -->
    <link rel="stylesheet" href="style.css?v=10000">
</head>
<body>

    <!-- 3D WebGL Canvas Layer -->
    <canvas id="stage3d"></canvas>

    <!-- Retro / Noir / Animus Effekt-Layer -->
    <div class="cinematic-vignette"></div>
    <div class="cinematic-scanlines"></div>
    <div class="cinematic-grain"></div>

    <!-- UI Overlay (Menü & Titel) -->
    <div class="ui-overlay">
        
        <!-- HEADER / LOGO -->
        <header class="ui-header">
            <div class="logo-container">
                <span class="logo-badge">
                    <span class="badge-pulse"></span>
                    v1.0 • Rainy Noir Edition
                </span>
                <h1 class="logo-title">PARTY<br>CHAOS</h1>
            </div>
        </header>

        <!-- MAIN MENU BUTTONS (OHNE EMOJIS, DAFÜR LEBENDIGE EFFEKTE) -->
        <main class="ui-main">
            <nav class="menu-container">
                <button class="menu-btn menu-btn--primary" onclick="createGame()">
                    <span class="btn-text">Spiel Erstellen</span>
                    <span class="btn-glyph">◆</span>
                </button>
                
                <button class="menu-btn" onclick="joinGame()">
                    <span class="btn-text">Spiel Beitreten</span>
                    <span class="btn-glyph">◈</span>
                </button>
                
                <button class="menu-btn" onclick="openSettings()">
                    <span class="btn-text">Einstellungen</span>
                    <span class="btn-glyph">⚙</span>
                </button>
                
                <button class="menu-btn" onclick="openInstructions()">
                    <span class="btn-text">Anleitung</span>
                    <span class="btn-glyph">📜</span>
                </button>
            </nav>
        </main>

        <!-- FOOTER STATUS -->
        <footer class="ui-footer">
            <p class="footer-info">Verbinde dich mit deinem Smartphone als Controller.</p>
            <div class="connection-status">
                <span class="status-dot"></span>
                <span>Server Bereit</span>
            </div>
        </footer>

    </div>

    <!-- JavaScript Modul Start -->
    <script type="module" src="script.js?v=10000"></script>
</body>
</html>
