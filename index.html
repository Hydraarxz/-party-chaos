<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Chaos</title>
    
    <!-- CSS-Einbindung mit Cache-Buster -->
    <link rel="stylesheet" href="style.css?v=6000">
</head>
<body>

    <!-- 3D WebGL Canvas Layer -->
    <canvas id="stage3d"></canvas>

    <!-- Retro / Noir Effekt-Layer -->
    <div class="cinematic-vignette"></div>
    <div class="cinematic-scanlines"></div>
    <div class="cinematic-grain"></div>

    <!-- UI Overlay (Menü & Titel) -->
    <div class="ui-overlay">
        
        <!-- HEADER / LOGO -->
        <header class="ui-header">
            <div class="logo-container">
                <span class="logo-badge">v1.0 • Rainy Noir Edition</span>
                <h1 class="logo-title">PARTY<br>CHAOS</h1>
            </div>
        </header>

        <!-- MAIN MENU BUTTONS -->
        <main class="ui-main">
            <nav class="menu-container">
    <button class="menu-btn menu-btn--primary" onclick="createGame()">
        <span>Spiel Erstellen</span>
        <span class="menu-btn-icon">➔</span>
    </button>
    
    <button class="menu-btn" onclick="joinGame()">
        <span>Spiel Beitreten</span>
        <span class="menu-btn-icon">➔</span>
    </button>
    
    <button class="menu-btn" onclick="openSettings()">
        <span>Einstellungen</span>
        <span class="menu-btn-icon">⚙</span>
    </button>
    
    <button class="menu-btn" onclick="openInstructions()">
        <span>Anleitung</span>
        <span class="menu-btn-icon">📜</span>
    </button>
</nav>

        </main>

        <!-- FOOTER STATUS -->
        <footer class="ui-footer">
            <p class="footer-info">Verbinde dich mit deinem Smartphone als Controller.</p>
            <div class="connection-status">
                <span class="status-dot"></span>
                <span>Server Bereit</span>
            </div>
        </footer>

    </div>

    <!-- JavaScript Modul Start -->
    <link rel="stylesheet" href="style.css?v=7000">

</body>
</html>
