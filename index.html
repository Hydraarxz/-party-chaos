<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Chaos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 3D Background Canvas -->
    <canvas id="stage3d"></canvas>

    <!-- UI Overlay -->
    <div class="menu">

        <!-- JACKBOX-STYLE 3D-BOX LOGO -->
        <div class="logo-box">
            <div class="logo-inner">
                <span class="tagline">THE</span>
                <h1 class="title party">PARTY</h1>
                <h1 class="title chaos">CHAOS</h1>
                <span class="pack-tag">PACK 1</span>
            </div>
        </div>

        <p class="subtitle">⚡ DAS ULTIMATIVE PARTY-GAME ⚡</p>

        <!-- BUTTONS -->
        <div class="menu-buttons">
            <button class="chaos-button create" onclick="createGame()">
                <span class="btn-icon">🎮</span> SPIEL ERSTELLEN
            </button>
            <button class="chaos-button join" onclick="joinGame()">
                <span class="btn-icon">🚪</span> SPIEL BEITRETEN
            </button>
        </div>

        <p class="version">v1.0 • CHAOS EDITION</p>

    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
