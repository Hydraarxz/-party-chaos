<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Chaos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 3D Canvas für Holzboden, Kiste & Regen-Fenster -->
    <canvas id="stage3d"></canvas>

    <!-- Hauptmenü Links -->
    <main class="ui-container">
        <header class="logo-group">
            <h1 class="logo-title">
                PARTY<br>
                CHAOS
            </h1>
        </header>

        <nav class="menu-list">
            <button class="menu-item active" onclick="createGame()">
                <span class="bullet">▶</span> SPIEL ERSTELLEN
            </button>
            <button class="menu-item" onclick="joinGame()">
                <span class="bullet">▶</span> SPIEL BEITRETEN
            </button>
            <button class="menu-item disabled">EINSTELLUNGEN</button>
            <button class="menu-item disabled">ANLEITUNG</button>
        </nav>

        <footer class="footer-info">
            <p>Verbinde dich mit deinem Smartphone als Controller.</p>
            <span class="version">v1.0 • RAINY NOIR EDITION</span>
        </footer>
    </main>

    <script type="module" src="script.js?v=2000"></script>



</body>
</html>
